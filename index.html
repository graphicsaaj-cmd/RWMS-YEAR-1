<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Stage 1 Promotional Examination</title>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #ff7675;
            --success: #2ecc71;
            --danger: #e74c3c;
            --background: #f4f7f6;
            --text-main: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        .header-banner {
            background-color: #002060;
            color: #ffffff;
            text-align: center;
            padding: 25px 15px;
            border-bottom: 5px solid #d4af37;
        }

        .header-banner h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: 1px;
        }

        .header-banner h2 {
            margin: 8px 0 0 0;
            font-size: 16px;
            font-weight: normal;
            color: #e0e0e0;
        }

        .header-banner h3 {
            margin: 5px 0 0 0;
            font-size: 14px;
            font-weight: bold;
            color: #d4af37;
        }

        .main-container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card-box {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 30px;
            margin-bottom: 25px;
        }

        #timer-box {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #e74c3c;
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 1000;
            display: none;
        }

        #login-screen {
            text-align: center;
            max-width: 500px;
            margin: 60px auto;
        }

        .input-field {
            width: 80%;
            padding: 12px 20px;
            margin: 20px 0;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            text-align: center;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #357abd;
        }

        #quiz-screen, #result-screen {
            display: none;
        }

        .candidate-meta {
            font-size: 16px;
            background: #eef2f7;
            padding: 12px 20px;
            border-radius: 6px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .question-wrapper {
            border-left: 5px solid var(--primary);
            background: #fafafa;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
        }

        .question-text {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .options-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 12px;
        }

        .option-item {
            display: flex;
            align-items: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 12px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-item:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .option-item input {
            margin-right: 12px;
            transform: scale(1.2);
        }

        /* Verification & State Styles */
        .option-item.correct {
            background-color: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724;
            font-weight: bold;
        }

        .option-item.wrong {
            background-color: #f8d7da !important;
            border-color: var(--danger) !important;
            color: #721c24;
        }

        .correction-badge {
            margin-top: 12px;
            font-weight: bold;
            color: #c0392b;
            font-size: 14px;
            display: none;
        }

        .result-box {
            text-align: center;
            background: #e8f8f5;
            border: 2px solid var(--success);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .result-box h2 {
            margin: 0 0 10px 0;
            color: #117a65;
        }
    </style>
</head>
<body>

<div id="timer-box">Time Left: 30:00</div>

<div class="header-banner">
    <h1>ROYAL WUNDERKIND MODEL SCHOOL</h1>
    <h2>JALALA AREA, TANKE, OKE - ODO, ILORIN</h2>
    <h3>PROMOTIONAL EXAMINATION 2025/2026 ACADEMIC SESSION</h3>
</div>

<div class="main-container">
    
    <div id="login-screen" class="card-box">
        <h2 style="margin-top:0;">Welcome Candidate</h2>
        <p>Please type your complete name below to begin the assessment.</p>
        <input type="text" id="student-name" class="input-field" placeholder="First Name & Surname" autocomplete="off">
        <br>
        <button class="btn" onclick="initializeQuiz()">Start Assessment</button>
    </div>

    <div id="quiz-screen">
        <div class="candidate-meta" id="display-meta"></div>
        
        <div id="result-screen" class="result-box">
            <h2 id="score-header"></h2>
            <p>Review your auto-marked choices and corrections below.</p>
        </div>

        <form id="assessment-form">
            <div id="questions-outlet"></div>
            
            <div style="text-align: center; margin-top: 40px;">
                <button type="button" id="submit-exam-btn" class="btn" style="background-color: #27ae60;" onclick="processGrading()">Submit Examination</button>
            </div>
        </form>
    </div>
</div>

<script>
    // System Core Exam Bank
    const itemsPool = [
        { q: "Cleanliness helps to prevent", o: ["Happiness", "Sickness", "Food", "Play"], a: "B" },
        { q: "We should wear", o: ["Dirty clothes", "Torn clothes", "Clean clothes", "Wet clothes"], a: "C" },
        { q: "Toothpaste is used for", o: ["Eating", "Washing clothes", "Brushing teeth", "Sleeping"], a: "C" },
        { q: "We use our mouth to __________.", o: ["walk", "eat", "run", "jump"], a: "B" },
        { q: "We use our hands to __________.", o: ["hold", "smell", "hear", "see"], a: "A" },
        { q: "We use our legs to __________.", o: ["write", "walk", "hear", "smell"], a: "B" },
        { q: "Internal organs are found __________ the body.", o: ["outside", "inside", "above", "beside"], a: "B" },
        { q: "The __________ controls the body.", o: ["heart", "brain", "lungs", "stomach"], a: "B" },
        { q: "The heart __________ blood.", o: ["drinks", "pumps", "eats", "stores"], a: "B" },
        { q: "We should cut our __________ regularly.", o: ["shoes", "fingernails", "bags", "desks"], a: "B" },
        { q: "Cleanliness helps us stay __________.", o: ["sick", "healthy", "weak", "hungry"], a: "B" },
        { q: "A clean child looks __________.", o: ["dirty", "smart", "rough", "tired"], a: "B" },
        { q: "Cotton wool is a __________ item.", o: ["cooking", "first aid", "school", "sports"], a: "B" },
        { q: "A cut may need __________.", o: ["food", "first aid", "music", "homework"], a: "B" },
        { q: "First aid helps prevent injury from getting __________.", o: ["better", "worse", "smaller", "cleaner"], a: "B" },
        { q: "A first aid box is used to keep __________ materials.", o: ["school", "sports", "first aid", "food"], a: "C" },
        { q: "Cotton wool is used to __________ wounds.", o: ["dirty", "clean", "throw", "hide"], a: "B" },
        { q: "Bandage is used to __________ wounds.", o: ["cover", "open", "cut", "break"], a: "A" },
        { q: "Antiseptic helps to kill __________.", o: ["books", "germs", "pencils", "toys"], a: "B" },
        { q: "Plaster is used for __________ cuts.", o: ["big", "small", "deep", "dirty"], a: "B" },
        { q: "Gloves protect the __________.", o: ["legs", "hands", "eyes", "nose"], a: "B" },
        { q: "Food helps us to __________.", o: ["sleep only", "grow and stay healthy", "cry", "fight"], a: "B" },
        { q: "Rice comes from __________.", o: ["animal", "plant", "river", "sky"], a: "B" },
        { q: "Milk comes from __________.", o: ["animal", "plant", "soil", "tree"], a: "A" },
        { q: "Garri is made from __________.", o: ["yam", "cassava", "rice", "maize"], a: "B" },
        { q: "Fish is food from __________.", o: ["plant", "animal", "tree", "fruit"], a: "B" },
        { q: "Throwing refuse into water causes __________ pollution.", o: ["air", "water", "land", "sound"], a: "B" },
        { q: "Loud music causes __________ pollution.", o: ["air", "land", "noise", "water"], a: "C" },
        { q: "Throwing waste on the ground causes __________ pollution.", o: ["water", "land", "air", "sound"], a: "B" },
        { q: "Pollution can cause __________.", o: ["health", "sickness", "joy", "learning"], a: "B" }
    ];

    let countdownInterval;
    let secondsLeft = 30 * 60; // 30 Minutes
    const keys = ["A", "B", "C", "D"];

    function initializeQuiz() {
        const studentName = document.getElementById('student-name').value.trim();
        if (studentName === "") {
            alert("Please enter candidate name to continue.");
            return;
        }

        // Configuration setup
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('timer-box').style.display = 'block';
        
        document.getElementById('display-meta').innerText = `CANDIDATE: ${studentName.toUpperCase()} | CLASS: KEY STAGE 1 (YEAR 1)`;

        renderItems();
        initiateTimer();
    }

    function renderItems() {
        const structuralTarget = document.getElementById('questions-outlet');
        structuralTarget.innerHTML = "";

        itemsPool.forEach((item, index) => {
            const itemNumber = index + 1;
            const block = document.createElement('div');
            block.className = 'card-box question-wrapper';

            let variantsMarkup = "";
            item.o.forEach((option, idx) => {
                const keyLetter = keys[idx];
                variantsMarkup += `
                    <label class="option-item" id="container-${itemNumber}-${keyLetter}">
                        <input type="radio" name="item-${itemNumber}" value="${keyLetter}">
                        <span><strong>${keyLetter}.</strong> ${option}</span>
                    </label>
                `;
            });

            block.innerHTML = `
                <div class="question-text">${itemNumber}. ${item.q}</div>
                <div class="options-layout">${variantsMarkup}</div>
                <div class="correction-badge" id="remedial-${itemNumber}"></div>
            `;
            structuralTarget.appendChild(block);
        });
    }

    function initiateTimer() {
        countdownInterval = setInterval(() => {
            secondsLeft--;
            let mins = Math.floor(secondsLeft / 60);
            let secs = secondsLeft % 60;

            mins = mins < 10 ? "0" + mins : mins;
            secs = secs < 10 ? "0" + secs : secs;

            document.getElementById('timer-box').innerText = `Time Left: ${mins}:${secs}`;

            if (secondsLeft <= 0) {
                clearInterval(countdownInterval);
                alert("Time allocation expired! Processing systemic automated submission.");
                processGrading();
            }
        }, 1000);
    }

    function processGrading() {
        clearInterval(countdownInterval);
        document.getElementById('timer-box').style.display = 'none';
        document.getElementById('submit-exam-btn').style.display = 'none';

        let correctTally = 0;
        const totalItems = itemsPool.length;

        itemsPool.forEach((item, index) => {
            const itemNumber = index + 1;
            const targetSelection = document.querySelector(`input[name="item-${itemNumber}"]:checked`);
            const selectedLetter = targetSelection ? targetSelection.value : null;
            const correctLetter = item.a;

            // Strict lock inputs
            const choices = document.querySelectorAll(`input[name="item-${itemNumber}"]`);
            choices.forEach(input => input.disabled = true);

            if (selectedLetter === correctLetter) {
                correctTally++;
                document.getElementById(`container-${itemNumber}-${correctLetter}`).classList.add('correct');
            } else {
                if (selectedLetter) {
                    document.getElementById(`container-${itemNumber}-${selectedLetter}`).classList.add('wrong');
                }
                document.getElementById(`container-${itemNumber}-${correctLetter}`).classList.add('correct');
                
                // Expose corrective text instruction underneath
                const textualTargetIndex = keys.indexOf(correctLetter);
                const stringAnswer = item.o[textualTargetIndex];
                const feedbackDiv = document.getElementById(`remedial-${itemNumber}`);
                feedbackDiv.innerText = `Correction: The correct option is ${correctLetter} (${stringAnswer})`;
                feedbackDiv.style.display = "block";
            }
        });

        const performancePercentage = Math.round((correctTally / totalItems) * 100);
        document.getElementById('score-header').innerText = `Score Summary: ${correctTally} / ${totalItems} (${performancePercentage}%)`;
        document.getElementById('result-screen').style.display = 'block';

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>

</body>
</html>

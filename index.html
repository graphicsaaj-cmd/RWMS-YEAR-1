<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Royal Wunderkind Model School - Examination</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 20px auto; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; }
        .timer { font-size: 20px; color: red; font-weight: bold; text-align: center; position: sticky; top: 0; background: #fff; padding: 10px; border-bottom: 2px solid #ccc; }
        .question { margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .options { margin: 10px 0; }
        .correct { color: green; font-weight: bold; }
        .wrong { color: red; font-weight: bold; }
        button { padding: 10px 20px; cursor: pointer; background: #002060; color: white; border: none; border-radius: 5px; }
        #quiz-screen, #result-screen { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen">
        <h1>ROYAL WUNDERKIND MODEL SCHOOL</h1>
        <h2>TERM THREE EXAMINATION</h2>
        <input type="text" id="student-name" placeholder="Enter Full Name" style="width: 100%; padding: 10px; margin: 20px 0;">
        <button onclick="startExam()">Start Examination</button>
    </div>

    <div id="quiz-screen">
        <div id="timer" class="timer">Time Remaining: 30:00</div>
        <form id="exam-form">
            </form>
        <button onclick="submitExam()">Submit Examination</button>
    </div>

    <div id="result-screen">
        <h2>Results</h2>
        <div id="score-display"></div>
        <div id="corrections"></div>
    </div>
</div>

<script>
    const questions = [
        { q: "Which container can hold the most water?", opt: ["Cup", "Spoon", "Bucket", "Bottle cap"], ans: 2 },
        { q: "Which shape has 4 equal sides?", opt: ["Triangle", "Circle", "Square", "Oval"], ans: 2 },
        { q: "Which of these is a three-dimensional (3D) shape?", opt: ["Rectangle", "Triangle", "Cube", "Square"], ans: 2 },
        { q: "Which shape can roll easily?", opt: ["Cube", "Cuboid", "Sphere", "Rectangle"], ans: 2 },
        { q: "A table top covers more space than a book. The table top has a:", opt: ["Smaller area", "Larger area", "Equal area", "No area"], ans: 1 },
        { q: "The number of pupils who like football in a class is an example of:", opt: ["Weight", "Capacity", "Statistics", "Time"], ans: 2 },
        { q: "#2.00 + #3.00 + #5.00 =", opt: ["#8.00", "#10.00", "#12.00", "#14.00"], ans: 1 },
        { q: "A cuboid has ________ corners", opt: ["6", "8", "10", "12"], ans: 1 },
        { q: "A cube has ______ edges", opt: ["6", "8", "10", "12"], ans: 3 },
        { q: "Which is lighter?", opt: ["Car", "Bicycle", "Truck", "Bus"], ans: 1 },
        { q: "Which is heavier?", opt: ["Feather", "Cotton wool", "Stone", "Leaf"], ans: 2 },
        { q: "Statistics help us compare:", opt: ["Information", "Weight only", "Time only", "Shapes only"], ans: 0 },
        { q: "Which shape looks like a ball?", opt: ["Cube", "Sphere", "Rectangle", "Triangle"], ans: 1 },
        { q: "How many days are in January ?", opt: ["28", "29", "30", "31"], ans: 3 },
        { q: "2 × 9 =", opt: ["18", "16", "24", "14"], ans: 0 },
        { q: "47 + 25 =", opt: ["74", "76", "78", "72"], ans: 3 },
        { q: "____ + 50 = 150", opt: ["100", "75", "58", "39"], ans: 0 },
        { q: "65 - 55 =", opt: ["15", "10", "20", "25"], ans: 1 },
        { q: "20 divide by 2 is", opt: ["20", "15", "25", "10"], ans: 3 },
        { q: "15 divided by 5 =", opt: ["9", "3", "8", "7"], ans: 1 }
    ];

    let timeLeft = 30 * 60;
    
    function startExam() {
        if(!document.getElementById('student-name').value) return alert("Please enter your name");
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        
        const form = document.getElementById('exam-form');
        questions.forEach((item, index) => {
            let html = `<div class="question"><p>${index + 1}. ${item.q}</p><div class="options">`;
            item.opt.forEach((o, i) => {
                html += `<label><input type="radio" name="q${index}" value="${i}"> ${o}</label><br>`;
            });
            html += `</div><div id="feed${index}"></div></div>`;
            form.innerHTML += html;
        });

        setInterval(() => {
            timeLeft--;
            let m = Math.floor(timeLeft/60), s = timeLeft % 60;
            document.getElementById('timer').innerText = `Time Remaining: ${m}:${s < 10 ? '0'+s : s}`;
            if(timeLeft <= 0) submitExam();
        }, 1000);
    }

    function submitExam() {
        let score = 0;
        questions.forEach((item, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const feedback = document.getElementById(`feed${index}`);
            if (selected && parseInt(selected.value) === item.ans) {
                score++;
                feedback.innerHTML = '<span class="correct">Correct!</span>';
            } else {
                feedback.innerHTML = `<span class="wrong">Wrong. Correct: ${item.opt[item.ans]}</span>`;
            }
        });
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('score-display').innerHTML = `<h3>Your Score: ${score} / ${questions.length}</h3>`;
    }
</script>
</body>
</html>
